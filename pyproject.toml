[project]
name = "transitphot"
version = "0.1.0"
description = "Local FITS-to-light-curve pipeline for exoplanet transit photometry"
requires-python = ">=3.10"
dependencies = [
    "astropy>=6.0",
    "numpy>=1.24",
    "ccdproc>=2.4",
    "photutils>=1.12",
    "astroquery>=0.4.7",
    "requests>=2.31",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Only needed to process UNSOLVED frames. Requires a C compiler on Windows
# (sep builds from source). Plate solving with ASTAP is the better path.
align = ["astroalign>=2.5"]

[project.scripts]
transitphot = "transitphot.cli:main"

[project.gui-scripts]
transitphot-gui = "transitphot.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
